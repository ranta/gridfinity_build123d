[project]
name = "gridfinity_build123d"
version = "0.1.0"
description = "Build123d library for gridfinity objects"
dependencies = [
  "build123d",
  "bd_warehouse@git+https://github.com/gumyr/bd_warehouse@48c507baac94231e2eb2c4032848719660f964dc",
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
  "coverage",
  "vulture",
  "ocp_vscode",
  "parameterized",
  "ruff",
  "mypy",
  "pytest-markdown-docs",
  "Sphinx",
  "sphinx-rtd-theme",
  "sphinx_design",
  "debugpy>=1.8.20",
  "basedpyright>=1.38.2",
]

[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.coverage.run]
branch = true
omit = ["test_*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN204", # https://docs.astral.sh/ruff/rules/missing-return-type-special-method/
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "PLR0913", # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "S603" # https://docs.astral.sh/ruff/rules/subprocess-without-shell-equals-true/
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
  "D100",
  "D101",
  "D102",
  "D107",
  "INP001",
  "N802",
  "PT009",
  "PT027",
]
"**/docs/*" = [
    "D100",
    "D101",
    "D102",
    "INP001"
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ['inherit_docstring']

[tool.ruff.lint.pycodestyle]
max-line-length = 101

[tool.basedpyright]
ignore = ["tests"]
